name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release

  linux-smoke:
    name: Linux smoke render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Render one frame of every tab
        run: |
          check() {
            ./target/release/taskmgr --once --tab "$1" > "/tmp/$1.txt"
            grep -q "$2" "/tmp/$1.txt"
          }
          check processes "Name"
          check performance "Utilization"
          check app-history "CPU time"
          check startup "Startup impact"
          check users "Session"
          check details "PID"
          check services "Description"
          echo "all tabs rendered"

  linux-container:
    name: Linux container render (no systemd)
    runs-on: ubuntu-latest
    container: rust:1-slim
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release
      - name: Render one frame of every tab
        run: |
          check() {
            ./target/release/taskmgr --once --tab "$1" > "/tmp/$1.txt"
            grep -q "$2" "/tmp/$1.txt"
          }
          check processes "Name"
          check performance "Utilization"
          check app-history "CPU time"
          check startup "Startup impact"
          check users "Session"
          check details "PID"
          check services "Description"
          grep -q "Services are unavailable" /tmp/services.txt
          echo "all tabs rendered without systemd"
