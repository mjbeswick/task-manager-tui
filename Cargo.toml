[package]
name = "task-manager-tui"
version = "0.1.0"
edition = "2024"
description = "A Windows 10 Task Manager clone for Linux and macOS terminals"
license = "MIT"

[[bin]]
name = "taskmgr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
libc = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40"
toml = "1"

[dev-dependencies]
insta = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
